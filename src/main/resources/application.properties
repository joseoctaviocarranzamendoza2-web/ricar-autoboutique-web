# Nombre de la aplicación Spring Boot
spring.application.name=web

# Configuración de Thymeleaf para cargar plantillas HTML desde src/main/resources/templates
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.web.resources.chain.cache=false

# Configuración de base de datos (usa variables de entorno si existen o valores locales por defecto)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ricar_autoboutique?useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1203128579}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuración de sesión HTTP de 20 minutos alineada al tiempo de vida del JWT (20m)
server.servlet.session.timeout=20m
server.servlet.session.cookie.max-age=20m
server.servlet.session.cookie.name=JSESSIONID
