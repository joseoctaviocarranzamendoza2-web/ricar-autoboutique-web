<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RICAR AUTOBOUTIQUE S.A.C.</title>
    <!-- Bootstrap 5.3.3 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons 1.11.3 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Estilos globales y específicos de rol -->
    <link th:href="@{/css/global.css}" rel="stylesheet">
    <link th:href="@{/css/roles/rol.css}" rel="stylesheet">
    <!-- Favicon -->
    <link rel="icon" th:href="@{/img/icono/icon.png}" type="image/png">
</head>
<body class="setup-role-body">

    <div class="setup-role-container">
        
        <!-- Contenido principal centrado -->
        <main class="setup-role-card">
            
            <!-- Saludo personalizado dinámico -->
            <header class="setup-role-header text-center">
                <div class="setup-role-marca">
                    <i class="bi bi-tools"></i> RICAR AUTOBOUTIQUE S.A.C.
                </div>
                <h2 class="saludo-titulo">
                    ¡Hola, <span class="nombre-destacado" id="usuarioNombre" th:text="${usuario != null ? usuario.nombres : 'Usuario'}">Usuario</span>!
                </h2>
                <h1 class="pregunta-subtitulo">
                    ¿Con qué rol deseas ingresar?
                </h1>
            </header>

            <div id="rolError" class="alert alert-danger text-center d-none" role="alert"></div>

            <!-- Contenedor dinámico de opciones de roles -->
            <section class="roles-opciones-wrapper" id="rolesContenedor" aria-label="Selección de rol de acceso">
                
                <!-- Opción: Gerente (Visible si el usuario posee dicho rol) -->
                <div class="rol-card-item d-none" id="opcion-gerente" data-rol="gerente" tabindex="0" role="button" aria-pressed="false" onclick="seleccionarRolCard('gerente')">
                    <div class="rol-avatar-circle">
                        <!-- Badge de checkmark posicionado a la 1 en punto -->
                        <div class="rol-check-badge">
                            <i class="bi bi-check-lg"></i>
                        </div>
                        <!-- Ilustración vectorial de Gerente -->
                        <div class="rol-svg-wrapper">
                            <svg viewBox="0 0 120 120" class="rol-avatar-svg" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="60" cy="60" r="54" fill="#E5E7EB"/>
                                <g transform="translate(0 -12)">
                                <!-- Cuerpo/Traje Ejecutivo -->
                                <path d="M28 106C28 89 42 78 60 78C78 78 92 89 92 106" fill="#111827"/>
                                <path d="M48 78L60 92L72 78" fill="#FFFFFF"/>
                                <!-- Corbata -->
                                <path d="M57 88L60 106L63 88L61 84H59L57 88Z" fill="#DC2626"/>
                                <!-- Cabeza / Cuello -->
                                <circle cx="60" cy="50" r="18" fill="#FBD38D"/>
                                <rect x="55" y="66" width="10" height="12" fill="#FBD38D"/>
                                <!-- Cabello ejecutivo -->
                                <path d="M42 48C42 36 50 30 60 30C70 30 78 36 78 48C78 40 70 35 60 35C50 35 44 42 42 48Z" fill="#334155"/>
                                <!-- Rostro -->
                                <circle cx="53" cy="50" r="2.5" fill="#1F2937"/>
                                <circle cx="67" cy="50" r="2.5" fill="#1F2937"/>
                                <path d="M55 58C57 60 63 60 65 58" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>
                                </g>
                            </svg>
                        </div>
                    </div>
                    <span class="rol-label">Gerente</span>
                </div>

                <!-- Opción: Administrador -->
                <div class="rol-card-item d-none" id="opcion-administrador" data-rol="administrador" tabindex="0" role="button" aria-pressed="false" onclick="seleccionarRolCard('administrador')">
                    <div class="rol-avatar-circle">
                        <!-- Badge de checkmark posicionado a la 1 en punto -->
                        <div class="rol-check-badge">
                            <i class="bi bi-check-lg"></i>
                        </div>
                        <!-- Ilustración vectorial del administrador -->
                        <div class="rol-svg-wrapper">
                            <svg viewBox="0 0 120 120" class="rol-avatar-svg" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="60" cy="60" r="54" fill="#F0FDF4"/>
                        <g transform="translate(0 -12)">
                        <!-- Polo azul oscuro -->
                        <path d="M26 106C26 88 41 76 60 76C79 76 94 88 94 106" fill="#1E3A8A"/>
                        <!-- Cuello camisa -->
                        <path d="M50 76L60 88L70 76" fill="#FFFFFF"/>
                                <!-- Manos en gesto de atención / soporte técnico -->
                                <path d="M36 100C38 92 46 92 48 97L54 106H32L36 100Z" fill="#FBD38D"/>
                                <path d="M84 100C82 92 74 92 72 97L66 106H88L84 100Z" fill="#FBD38D"/>
                                <!-- Cabeza / Rostro -->
                                <circle cx="60" cy="48" r="18" fill="#FBD38D"/>
                                <rect x="55" y="64" width="10" height="12" fill="#FBD38D"/>
                                <!-- Cabello oscuro -->
                                <path d="M42 46C42 34 50 28 60 28C70 28 78 34 78 46C78 38 72 32 60 32C48 32 44 40 42 46Z" fill="#1E293B"/>
                                <!-- Ojos y Sonrisa -->
                                <circle cx="53" cy="48" r="2.5" fill="#1F2937"/>
                                <circle cx="67" cy="48" r="2.5" fill="#1F2937"/>
                                <path d="M55 56C57 59 63 59 65 56" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>
                                <!-- Lentes rectangulares azules -->
                                <rect x="47" y="44" width="11" height="8" rx="2" stroke="#1E3A8A" stroke-width="1.8" fill="none"/>
                                <rect x="62" y="44" width="11" height="8" rx="2" stroke="#1E3A8A" stroke-width="1.8" fill="none"/>
                                <line x1="58" y1="48" x2="62" y2="48" stroke="#1E3A8A" stroke-width="1.8"/>
                                </g>
                            </svg>
                        </div>
                    </div>
                    <span class="rol-label">Administrador</span>
                </div>

                <!-- Opción: Cliente -->
                <div class="rol-card-item d-none" id="opcion-cliente" data-rol="cliente" tabindex="0" role="button" aria-pressed="false" onclick="seleccionarRolCard('cliente')">
                    <div class="rol-avatar-circle">
                        <!-- Badge de checkmark posicionado a la 1 en punto -->
                        <div class="rol-check-badge">
                            <i class="bi bi-check-lg"></i>
                        </div>
                        <!-- Ilustración de cliente con polo -->
                        <div class="rol-svg-wrapper">
                            <svg viewBox="0 0 120 120" class="rol-avatar-svg" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="60" cy="60" r="54" fill="#EFF6FF"/>
                                <g transform="translate(0 -12)">
                                <path d="M26 106C26 88 41 76 60 76C79 76 94 88 94 106" fill="#56AEE8"/>
                                <rect x="55" y="64" width="10" height="12" fill="#F4C28E"/>
                                <path d="M50 76L60 88L70 76" fill="#F4C28E"/>
                                <circle cx="60" cy="48" r="18" fill="#F4C28E"/>
                                <path d="M42 47C41 35 49 28 60 28C71 28 79 35 78 47L74 43C69 39 64 38 58 38C52 38 47 41 44 46L42 47Z" fill="#26364A"/>
                                <path d="M42 46C42 42 44 38 47 35" stroke="#26364A" stroke-width="5" stroke-linecap="round"/>
                                <circle cx="53" cy="49" r="1.8" fill="#26364A"/>
                                <circle cx="67" cy="49" r="1.8" fill="#26364A"/>
                                <path d="M55 57C58 60 62 60 65 57" stroke="#9B5B46" stroke-width="2" stroke-linecap="round"/>
                                </g>
                            </svg>
                        </div>
                    </div>
                    <span class="rol-label">Cliente</span>
                </div>

            </section>

            <!-- Botón principal de confirmación -->
            <footer class="setup-role-actions text-center mt-5">
                <button type="button" class="btn btn-continuar" id="btnContinuarRol" onclick="confirmarRolSeleccionado()" disabled>
                    Continuar
                </button>
                <div class="mt-4">
                    <a href="/inicio" class="text-decoration-none text-muted small hover-primary">
                        <i class="bi bi-arrow-left me-1"></i>Volver a la página principal
                    </a>
                </div>
            </footer>

        </main>
    </div>

    <!-- Scripts compartidos y controlador de selección de rol -->
    <script th:src="@{/js/global.js}"></script>
    <script th:src="@{/js/roles/rol.js}"></script>
</body>
</html>
